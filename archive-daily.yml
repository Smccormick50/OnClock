name: Archive daily logs

on:
  schedule:
    # Each run archives *yesterday* (Central time), so these must fire
    # AFTER midnight Central in both daylight-saving states — a cron
    # can only be written in UTC:
    #   - "30 6 * * *"   = 1:30am CDT / 12:30am CST  (the main run)
    #   - "30 10 * * *"  = 5:30am CDT / 4:30am CST   (a backup attempt)
    # Both are after midnight either way. GitHub doesn't guarantee
    # scheduled runs fire on time — on this repo they've landed 5-7
    # hours late — but a delayed run still means "yesterday", so lateness
    # is harmless. Running twice is harmless too: archiving is an
    # idempotent overwrite. (An earlier version fired at 11:59pm Central,
    # which only worked because GitHub happened to be late; a punctual
    # run would have archived the day *before* the one that was ending.)
    - cron: "30 6 * * *"
    - cron: "30 10 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Archive a date (YYYY-MM-DD). Blank = yesterday. Today = safe up-to-now snapshot; the live shift stays open."
        required: false
        type: string
      endDate:
        description: "Optional — fill this in too to backfill every date from 'date' through this one, inclusive (e.g. catching up several days that were never archived). Leave blank to archive just the single 'date' above."
        required: false
        type: string

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
        working-directory: scripts
      - run: node archive-daily.js
        working-directory: scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ARCHIVE_DATE: ${{ github.event.inputs.date }}
          ARCHIVE_END_DATE: ${{ github.event.inputs.endDate }}
