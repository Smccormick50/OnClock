name: Backfill audit history

on:
  workflow_dispatch:
    inputs:
      startDate:
        description: "First work date to rebuild (YYYY-MM-DD)"
        required: true
        default: "2026-09-16"
        type: string
      endDate:
        description: "Last work date to rebuild (YYYY-MM-DD). Use 2026-09-23 to avoid duplicating the live Audit Log."
        required: true
        default: "2026-09-23"
        type: string

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
        working-directory: scripts
      - run: node backfill-audit.js
        working-directory: scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          AUDIT_START_DATE: ${{ github.event.inputs.startDate }}
          AUDIT_END_DATE: ${{ github.event.inputs.endDate }}
