name: Archive daily logs

on:
  schedule:
    # 06:10 UTC is always after midnight in America/Chicago:
    # 1:10am during daylight time and 12:10am during standard time.
    # The script archives the completed previous Central-calendar day.
    - cron: "10 6 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Archive a date (YYYY-MM-DD). Blank = yesterday. Today = safe up-to-now snapshot; the live shift stays open."
        required: false
        type: string
      endDate:
        description: "Optional — fill this in too to backfill every date from 'date' through this one, inclusive (e.g. catching up several days that were never archived). Leave blank to archive just the single 'date' above."
        required: false
        type: string

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
        working-directory: scripts
      - run: node archive-daily.js
        working-directory: scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ARCHIVE_DATE: ${{ github.event.inputs.date }}
          ARCHIVE_END_DATE: ${{ github.event.inputs.endDate }}
