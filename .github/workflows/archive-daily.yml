name: Archive daily logs

on:
  schedule:
    # Targets 11:59pm America/Chicago directly, in UTC, since cron
    # can't express a local time zone. Two entries because the UTC
    # offset changes with daylight saving:
    #   - "59 4 * * *"  = 23:59 CDT (UTC-5, roughly Mar-Nov)
    #   - "59 5 * * *"  = 23:59 CST (UTC-6, roughly Nov-Mar)
    # GitHub Actions doesn't guarantee scheduled workflows fire at the
    # requested time and can delay them by hours under load, so the
    # script itself doesn't try to detect "is it close enough to
    # midnight" anymore — every scheduled run just always archives
    # "yesterday" (Chicago time), which is correct no matter how late
    # it actually executes. Two scheduled attempts a day (rather than
    # one) just adds a little redundancy against a run getting skipped
    # entirely; both landing the same day is harmless; see
    # archive-daily.js for why.
    - cron: "59 4 * * *"
    - cron: "59 5 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Archive a specific date (YYYY-MM-DD). Leave blank to archive today right now instead of waiting for 11pm."
        required: false
        type: string
      endDate:
        description: "Optional — fill this in too to backfill every date from 'date' through this one, inclusive (e.g. catching up several days that were never archived). Leave blank to archive just the single 'date' above."
        required: false
        type: string

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
        working-directory: scripts
      - run: node archive-daily.js
        working-directory: scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ARCHIVE_DATE: ${{ github.event.inputs.date }}
          ARCHIVE_END_DATE: ${{ github.event.inputs.endDate }}
