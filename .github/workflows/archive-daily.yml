name: Archive daily logs

on:
  schedule:
    # Targets 11:59pm America/Chicago directly, in UTC, since cron
    # can't express a local time zone. Two entries because the UTC
    # offset changes with daylight saving:
    #   - "59 4 * * *"  = 23:59 CDT (UTC-5, roughly Mar-Nov)
    #   - "59 5 * * *"  = 23:59 CST (UTC-6, roughly Nov-Mar)
    # Whichever one lands outside the real 11pm hour self-skips (see
    # archive-daily.js), so only one of these two actually archives
    # on any given night. This intentionally schedules only 2 runs a
    # day rather than 24 hourly ones — GitHub Actions does not
    # guarantee scheduled workflows fire exactly on time and can skip
    # runs under load, and that's more likely the more often a
    # schedule fires. Two precise attempts a day is far more reliable
    # in practice than 24 hourly "is it time yet?" checks.
    - cron: "59 4 * * *"
    - cron: "59 5 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Re-archive a specific date (YYYY-MM-DD). Leave blank to archive today right now instead of waiting for 11pm — e.g. use this after an admin corrects a past day's punches, to refresh that day's saved PDF."
        required: false
        type: string

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
        working-directory: scripts
      - run: node archive-daily.js
        working-directory: scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ARCHIVE_DATE: ${{ github.event.inputs.date }}
